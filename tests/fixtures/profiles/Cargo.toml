[package]
name = "profiles"
version = "0.1.0"
edition = "2021"

[dependencies]
itoa = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "fat"
panic = "abort"
opt-level = "s"
codegen-units = 1

[profile.release.package.itoa]
opt-level = 3

[profile.thin]
inherits = "release"
lto = "thin"
panic = "unwind"

[profile.nolto]
inherits = "release"
lto = "off"
