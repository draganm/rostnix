[build]
# Not used: a target table that matches has flags of its own.
rustflags = ["--cfg", "from_build"]

[target.'cfg(unix)']
rustflags = ["--cfg", "from_unix", "-A", "dead_code"]

[target.'cfg(all(unix, any(target_os = "macos", target_os = "linux")))']
rustflags = "--cfg from_expression"

# The table of the machine's triple, whichever of these it is.
[target.aarch64-apple-darwin]
rustflags = ["--cfg", "from_triple"]

[target.x86_64-apple-darwin]
rustflags = ["--cfg", "from_triple"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["--cfg", "from_triple"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["--cfg", "from_triple"]

# Matches because of the flag the triple's table gives: cargo reads the
# tables again with the cfgs that the flags bring about.
[target.'cfg(from_triple)']
rustflags = ["--cfg", "from_flag"]

[target.'cfg(windows)']
rustflags = ["--cfg", "from_windows"]

[env]
# The workspace itself: the usual way to tell code where its workspace is.
FIXTURE_WORKSPACE = { value = "", relative = true }
