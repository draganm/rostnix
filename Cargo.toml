[package]
name = "rostnix"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Builds Rust programs with one Nix derivation per cargo unit and nothing generated to check in"
repository = "https://github.com/draganm/rostnix"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
